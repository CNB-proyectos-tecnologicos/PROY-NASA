<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerospace Health · Consola médica de tierra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* Aerospace Health · Monitor
   Idea de diseño: un monitor de cabecera. Barra fija, franja de alertas visible en todo panel y un panel activo.
   El monitor es una rejilla de filas «onda | número». Tipografía recta de instrumento clínico; el color solo comunica estado. */
:root {
  --fondo: #080D1C; --panel: #111A30; --texto: #F5F8FF; --tenue: #93A0C2; --linea: #24314F; --hundido: #0B1224;
  --onda: #59DEE7; --estable: #59DCB5; --precaucion: #FFC55C; --urgencia: #FF748E; --animo: #B0A1FF;
  --f-num: Inter, "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif;
  --f-ui: Inter, "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --grosor: 1; color-scheme: dark;
}
:root[data-modo="accesible"] {
  --fondo: #03060E; --panel: #0B1226; --texto: #FFFFFF; --tenue: #C9D2EC; --linea: #46578A; --hundido: #060B18;
  --onda: #72D2FF; --estable: #72D2FF; --precaucion: #FFC55C; --urgencia: #FF84C2; --animo: #C0B3FF; --grosor: 1.5;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 400 15px/1.45 var(--f-ui); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
.s-estable { --c: var(--estable); } .s-precaucion, .s-aviso { --c: var(--precaucion); } .s-urgencia { --c: var(--urgencia); } .s-nd { --c: var(--tenue); } .s-animo { --c: var(--animo); }

/* ---------- barra superior */
.barra { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-bottom: 1px solid var(--linea); background: var(--hundido); flex-wrap: wrap; }
.marca { display: flex; align-items: baseline; gap: 8px; font: 600 15px var(--f-ui); white-space: nowrap; }
.marca span { color: var(--tenue); font-weight: 400; }
.tabs { display: flex; gap: 2px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font: 500 14px var(--f-ui); color: var(--tenue); }
.tabs button:hover { color: var(--texto); }
.tabs button.on { color: var(--texto); border-bottom-color: var(--onda); }
.tabs button .punto { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--animo); color: #10122a; font: 600 11px/18px var(--f-ui); letter-spacing: 0; text-align: center; }
.estado { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 400 12.5px var(--f-ui); color: var(--tenue); white-space: nowrap; }
.chip i { width: 8px; height: 8px; background: var(--c, var(--tenue)); }
.chip em { font-style: normal; font-weight: 500; color: var(--texto); }
.seg { display: inline-flex; border: 1px solid var(--linea); border-radius: 3px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; font-size: 12px; color: var(--tenue); }
.seg button.on { background: var(--texto); color: var(--fondo); font-weight: 600; }
.btn-audio { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--linea); border-radius: 3px; padding: 4px 10px; font: 600 11px var(--f-ui); letter-spacing: .03em; }
.btn-audio svg { width: 15px; height: 15px; }
.btn-audio.pide { border-color: var(--precaucion); color: var(--precaucion); }
.btn-audio.mudo { color: var(--tenue); }
.reloj { font: 500 18px var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.btn-opc { background: none; border: 0; padding: 4px; color: var(--tenue); opacity: .75; display: inline-flex; }
.btn-opc svg { width: 17px; height: 17px; }
.btn-opc:hover, .btn-opc.on { color: var(--texto); opacity: 1; }

/* ---------- franja de alertas (visible en cualquier panel) */
.franja { display: flex; align-items: center; gap: 12px; padding: 6px 16px; border-bottom: 1px solid var(--linea); border-left: 6px solid var(--c); min-height: 38px; background: color-mix(in srgb, var(--c) 9%, var(--fondo)); flex-wrap: wrap; }
.franja .ico { font: 700 18px var(--f-ui); color: var(--c); width: 20px; text-align: center; }
.franja .niv { font: 700 12px var(--f-ui); letter-spacing: .03em; color: var(--c); white-space: nowrap; }
.franja .txt { flex: 1 1 260px; min-width: 0; font-size: 14px; }
.franja .txt b { font-weight: 600; }
.franja .txt span { color: var(--tenue); }
.franja .mas { background: none; border: 1px solid var(--linea); border-radius: 3px; padding: 2px 8px; font-size: 12px; color: var(--tenue); }
.franja.s-urgencia { animation: pulso-franja 1s steps(2, jump-none) infinite; }
@keyframes pulso-franja { 50% { background: color-mix(in srgb, var(--c) 26%, var(--fondo)); } }
.btn { background: none; border: 1px solid var(--linea); border-radius: 3px; padding: 5px 12px; font: 500 13px var(--f-ui); white-space: nowrap; }
.btn:hover { border-color: var(--texto); }
.btn.pri { background: var(--onda); border-color: var(--onda); color: #06202a; }
.btn.peligro { border-color: var(--urgencia); color: var(--urgencia); }
.btn.vio { border-color: var(--animo); color: var(--animo); }
.btn:disabled { opacity: .45; cursor: default; }
.franja { position: relative; }
.lista-alertas { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; display: grid; gap: 4px; padding: 6px 16px 10px; background: var(--fondo); border-bottom: 1px solid var(--linea); box-shadow: 0 10px 24px rgba(0, 0, 0, .45); max-height: 60vh; overflow: auto; }
.lista-alertas .al { display: grid; grid-template-columns: 24px 110px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 5px 8px; border-left: 4px solid var(--c); background: var(--panel); font-size: 13px; }
.lista-alertas .al .i { color: var(--c); font-weight: 700; text-align: center; }
.lista-alertas .al .n { color: var(--c); font: 700 11px var(--f-ui); letter-spacing: .03em; }
.lista-alertas .al small { color: var(--tenue); display: block; }

main { min-height: 0; position: relative; }
.panel { display: none; height: 100%; overflow: auto; }
.panel.on { display: block; }

/* ---------- panel principal: monitor */
#p-monitor.on { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }
.mon { display: grid; grid-template-rows: repeat(4, minmax(70px, 1fr)) minmax(112px, .9fr); min-height: 0; }
.fila { display: grid; grid-template-columns: minmax(0, 1fr) clamp(170px, 24vw, 330px); border-bottom: 1px solid var(--linea); min-height: 0; }
.onda { position: relative; min-width: 0; min-height: 0; background-image: linear-gradient(var(--linea) 1px, transparent 1px), linear-gradient(90deg, var(--linea) 1px, transparent 1px); background-size: 100% 25%, 8.333% 100%; background-color: var(--fondo); }
:root[data-rejilla="no"] .onda { background-image: none; }
.onda canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.onda .rot { position: absolute; left: 10px; top: 5px; z-index: 1; font: 400 12px var(--f-ui); color: var(--tenue); }
.onda .rot b { color: var(--onda); font-weight: 600; margin-right: 6px; }
.onda .msj { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; font: 600 clamp(14px, 2.4vh, 22px) var(--f-num); letter-spacing: .03em; color: var(--precaucion); background: var(--fondo); padding: 2px 12px; white-space: nowrap; }
.onda .msj:empty { display: none; }
.num, .caja { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 6px 12px 6px 14px; border-left: 1px solid var(--linea); background: var(--panel); min-width: 0; min-height: 0; overflow: hidden; }
.num::before, .caja::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.cab { display: flex; align-items: baseline; gap: 8px; font: 500 14px var(--f-num); letter-spacing: .03em; color: var(--c); }
.cab .un { font-weight: 300; font-size: 12px; color: var(--tenue); letter-spacing: .04em; }
.cab .lim { margin-left: auto; font: 400 11px var(--f-ui); color: var(--tenue); letter-spacing: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.val { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 0; color: var(--c); }
.val b { font: 500 clamp(36px, 9vh, 100px)/.92 var(--f-num); font-variant-numeric: tabular-nums; font-feature-settings: "tnum", "cv11"; letter-spacing: -.025em; white-space: nowrap; }
:root[data-modo="accesible"] .val b { font-weight: 600; }
#v-pa { font-size: clamp(30px, 7.2vh, 80px); }
.val .aux { font: 400 clamp(15px, 2.6vh, 26px) var(--f-num); color: var(--tenue); }
.lat { font-style: normal; font-size: clamp(14px, 2.6vh, 24px); opacity: .25; align-self: flex-start; margin-top: 6px; }
.lat.on { opacity: 1; }
.pie { display: flex; align-items: center; gap: 8px; min-height: 20px; font-size: 12px; color: var(--tenue); white-space: nowrap; overflow: hidden; }
.est { font: 700 11px var(--f-ui); letter-spacing: .03em; color: var(--c); }
.pie .sub { margin-left: auto; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.fila3 { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, .95fr) minmax(0, 1.75fr) minmax(0, .8fr); min-height: 0; }
.fila3 .caja { border-left: 0; border-right: 1px solid var(--linea); grid-template-rows: auto minmax(0, 1fr) auto; }
.fila3 .val b { font-size: clamp(30px, 6.6vh, 76px); }
#v-pa { font-size: clamp(30px, 7.4vh, 84px); }
.cab-datos { grid-column: 1 / -1; display: grid; align-content: center; gap: 3px; font-size: 12.5px; color: var(--tenue); }
.cab-datos b { color: var(--c, var(--texto)); font: 500 clamp(17px, 2.6vh, 24px) var(--f-num); font-variant-numeric: tabular-nums; }
.caja .cuerpo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: stretch; min-height: 0; }
.caja .cuerpo canvas { width: 100%; height: 100%; min-height: 40px; display: block; }
.caja.rad .cuerpo { grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); }
.rad-datos { display: grid; align-content: center; gap: 2px; font-size: 12px; color: var(--tenue); min-width: 0; }
.rad-datos b { color: var(--texto); font: 500 15px var(--f-num); font-variant-numeric: tabular-nums; }
.barra-dosis { height: 8px; background: var(--hundido); border: 1px solid var(--linea); position: relative; }
.barra-dosis i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); }
.graf { position: relative; min-width: 0; min-height: 0; }
.graf span { position: absolute; right: 2px; top: -2px; font-size: 10px; color: var(--tenue); letter-spacing: .03em; pointer-events: none; white-space: nowrap; }
.mon-pie { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-top: 1px solid var(--linea); background: var(--hundido); flex-wrap: wrap; }
.btn-animo, .btn-sos { border-radius: 3px; padding: 7px 18px; font: 500 14px var(--f-ui); background: none; }
.btn-animo { border: 1px solid var(--animo); color: var(--animo); }
.btn-sos { border: 1px solid var(--urgencia); color: var(--urgencia); display: inline-flex; align-items: center; gap: 8px; }
.btn-sos b { background: var(--urgencia); color: #1b0710; padding: 0 6px; border-radius: 2px; font-weight: 600; }
.esc { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 500 11px var(--f-ui); letter-spacing: .03em; color: var(--tenue); }
select, input[type="text"], input[type="number"], input[type="date"], input[type="password"], input[type="search"], textarea { background: var(--hundido); border: 1px solid var(--linea); border-radius: 3px; padding: 5px 8px; min-width: 0; }
select { padding-right: 4px; }
input[type="range"] { accent-color: var(--onda); width: 100%; }

/* ---------- paneles de trabajo */
.rej { display: grid; gap: 14px; padding: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); align-content: start; max-width: 1500px; margin: 0 auto; }
.tarj { background: var(--panel); border: 1px solid var(--linea); border-radius: 4px; padding: 14px 16px; min-width: 0; grid-column: span 4; display: grid; gap: 10px; align-content: start; }
.tarj.c6 { grid-column: span 6; } .tarj.c8 { grid-column: span 8; } .tarj.c12 { grid-column: 1 / -1; } .tarj.c3 { grid-column: span 3; }
.tarj h2 { margin: 0; font: 600 15px var(--f-ui); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tarj h2 small { font: 400 12px var(--f-ui); letter-spacing: 0; text-transform: none; color: var(--tenue); }
.tarj h3 { margin: 6px 0 0; font: 600 12px var(--f-ui); letter-spacing: .03em; text-transform: uppercase; color: var(--tenue); }
.tarj p { margin: 0; }
.nota { font-size: 12.5px; color: var(--tenue); max-width: 70ch; }
.fila-btn { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.campo { display: grid; gap: 3px; font-size: 12px; color: var(--tenue); min-width: 0; }
.campo input, .campo select { width: 100%; color: var(--texto); font-size: 14px; }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.op { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linea); }
.op:first-of-type { border-top: 0; }
.op b { font-weight: 500; }
.op small { grid-column: 1; color: var(--tenue); font-size: 12.5px; }
.op > :last-child:not(small) { grid-row: 1 / span 2; grid-column: 2; }
.sw { appearance: none; width: 42px; height: 22px; border-radius: 11px; border: 1px solid var(--linea); background: var(--hundido); position: relative; cursor: pointer; margin: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--tenue); transition: left .12s; }
.sw:checked { background: color-mix(in srgb, var(--onda) 35%, var(--hundido)); border-color: var(--onda); }
.sw:checked::after { left: 22px; background: var(--onda); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--linea); font-variant-numeric: tabular-nums; white-space: nowrap; }
th { font: 600 11px var(--f-ui); letter-spacing: .03em; color: var(--tenue); text-transform: uppercase; }
.tabla { overflow-x: auto; }
td.b, td.a { color: var(--precaucion); font-weight: 600; }
.etq { display: inline-block; padding: 1px 7px; border: 1px solid var(--c, var(--linea)); color: var(--c, var(--tenue)); border-radius: 3px; font: 600 11px var(--f-ui); letter-spacing: .03em; white-space: nowrap; }
.sub-tabs { display: flex; gap: 2px; padding: 10px 16px 0; border-bottom: 1px solid var(--linea); flex-wrap: wrap; max-width: 1500px; margin: 0 auto; }
.sub-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px; font: 500 13.5px var(--f-ui); color: var(--tenue); }
.sub-tabs button.on { color: var(--texto); border-bottom-color: var(--onda); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kpi { border-left: 3px solid var(--c, var(--linea)); padding: 2px 0 2px 10px; }
.kpi span { display: block; font: 600 11px var(--f-ui); letter-spacing: .03em; color: var(--tenue); text-transform: uppercase; }
.kpi b { font: 500 28px/1.1 var(--f-num); color: var(--c, var(--texto)); font-variant-numeric: tabular-nums; }
.kpi b small { font-size: 13px; color: var(--tenue); }
.kpi em { display: block; font-style: normal; font-size: 12px; color: var(--tenue); }
.lienzo { width: 100%; height: 150px; display: block; }
details { border-top: 1px solid var(--linea); padding: 8px 0; }
details summary { cursor: pointer; font: 600 14px var(--f-ui); }
details[open] summary { margin-bottom: 8px; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; font-size: 14px; }
dt { color: var(--tenue); } dd { margin: 0; }

/* ---------- asistente */
.chat { display: grid; gap: 8px; max-height: 46vh; min-height: 180px; overflow: auto; padding: 4px 2px; align-content: start; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 4px; background: var(--hundido); border-left: 3px solid var(--animo); font-size: 14.5px; }
.msg.yo { justify-self: end; border-left: 0; border-right: 3px solid var(--onda); }
.msg small { display: block; font: 600 10.5px var(--f-ui); letter-spacing: .03em; color: var(--tenue); margin-bottom: 2px; }
.msg.s-urgencia, .msg.s-precaucion { border-left-color: var(--c); }
.entrada { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.entrada input { padding: 9px 12px; font-size: 15px; }
.btn-mic { width: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.btn-mic svg { width: 18px; height: 18px; }
.btn-mic.on { background: var(--urgencia); border-color: var(--urgencia); color: #1b0710; }
.sugs { display: flex; gap: 6px; flex-wrap: wrap; }
.sugs button { background: none; border: 1px solid var(--linea); border-radius: 14px; padding: 3px 11px; font-size: 12.5px; color: var(--tenue); }
.sugs button:hover { color: var(--texto); border-color: var(--texto); }
.desl { display: grid; grid-template-columns: 96px minmax(0, 1fr) 74px; gap: 10px; align-items: center; font-size: 13px; }
.desl output { font: 400 17px var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.prob { display: grid; grid-template-columns: 104px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 12px; }
.prob i { height: 12px; background: var(--hundido); border: 1px solid var(--linea); position: relative; display: block; }
.prob i u { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c, var(--onda)); }
.prob span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.veredicto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.veredicto div { border: 1px solid var(--linea); border-top: 3px solid var(--c, var(--tenue)); padding: 6px 8px; }
.veredicto span { display: block; font: 600 10.5px var(--f-ui); letter-spacing: .03em; color: var(--tenue); text-transform: uppercase; }
.veredicto b { color: var(--c, var(--texto)); font: 500 15px var(--f-num); letter-spacing: .04em; }
.pruebas { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.pruebas button { background: var(--hundido); border: 1px solid var(--linea); border-radius: 4px; padding: 10px; text-align: left; display: grid; gap: 2px; }
.pruebas button:hover { border-color: var(--animo); }
.pruebas b { color: var(--animo); font: 500 14px var(--f-num); letter-spacing: .03em; }
.pruebas small { color: var(--tenue); font-size: 12px; }
.zona { border: 1px solid var(--animo); border-radius: 4px; padding: 14px; display: grid; gap: 12px; }
.cielos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.cielos button { background: var(--hundido); border: 1px solid var(--linea); border-radius: 4px; padding: 6px 2px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--tenue); }
.cielos button[aria-pressed="true"] { border-color: var(--animo); color: var(--texto); background: color-mix(in srgb, var(--animo) 16%, var(--hundido)); }
.cielos svg { width: 64px; height: 64px; }
.cielo-hist { display: flex; gap: 2px; flex-wrap: wrap; align-items: flex-end; }
.cielo-hist div { display: grid; justify-items: center; font-size: 10px; color: var(--tenue); }
.cielo-hist svg { width: 42px; height: 42px; }
.escala { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.escala.e6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.escala button, .fichas button { background: var(--hundido); border: 1px solid var(--linea); border-radius: 3px; padding: 6px 0; font: 400 15px var(--f-num); }
.escala button[aria-pressed="true"], .fichas button[aria-pressed="true"] { background: var(--animo); border-color: var(--animo); color: #14102e; font-weight: 600; }
.fichas { display: flex; gap: 6px; flex-wrap: wrap; }
.fichas button { padding: 4px 12px; font: 400 13px var(--f-ui); border-radius: 14px; }
.diana { height: 150px; border: 1px solid var(--linea); border-radius: 4px; display: grid; place-items: center; font: 400 20px var(--f-num); letter-spacing: .03em; background: var(--hundido); user-select: none; cursor: pointer; text-align: center; padding: 8px; }
.diana.ya { background: var(--animo); color: #14102e; font-weight: 600; }

    if (a === "evaluar") { ocupado = true; pintar(); try { evalua = { r: await api("/api/evaluar", { datos: est.estado.entradas, explicar: true }), t: Date.now() }; } catch (err) { evalua = { error: err.message }; } ocupado = false; pintar(); }
    else if (a === "interpretar") { ocupado = true; pintar(); try { const r = await api("/api/llm", { proveedor: (cfgMon.llm && cfgMon.llm.proveedor === "local") ? "local" : "groq", modelo: cfgMon.llm && (cfgMon.llm.proveedor === "local" ? cfgMon.llm.modelo_local : cfgMon.llm.modelo), base: cfgMon.llm && cfgMon.llm.base_local, max_tokens: 1800,
        mensajes: [{ role: "system", content: HEALER + (idioma === "en" ? " Answer in English." : " Responde siempre en español.") }, { role: "user", content: "BIOMETRIC PACKAGE\n" + est.estado.paquete }] }); interp = { texto: String(r.texto || "").trim(), origen: "Astronaut Healer · " + r.proveedor + " · " + r.modelo, t: Date.now() }; } catch (err) { interp = { error: err.message }; } ocupado = false; pintar(); }
    else if (a === "enviar-interp" && interp && interp.texto) { await enviar("Interpretación del paquete biométrico (" + interp.origen + ", revisada por " + autor + "):\n" + interp.texto); }
  });

  // ---- intercomunicación
  function pintarHilo() {
    const c = $("#m-hilo"), abajo = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
    c.innerHTML = msgs.length ? msgs.map(m => '<div class="msg ' + (m.de === "tierra" ? "yo" : "tierra") + '"><small>' + esc(m.de === "tierra" ? (m.autor || "Médico en tierra") : (m.autor || "Tripulante")) + " · " + fecha(m.t * 1000).slice(5) + " " + hora(m.t * 1000).slice(0, 5) + (m.tipo === "consulta" ? " · " + AH.tr("consulta") : "") + "</small>" +
      (m.tipo === "consulta" || m.tipo === "dolor" ? "<details open><summary>" + esc(m.texto.split("\n")[0]) + "</summary>" + esc(m.texto.split("\n").slice(1).join("\n")).replace(/\n/g, "<br>") + "</details>" : esc(m.texto).replace(/\n/g, "<br>")) + "</div>").join("") : '<div class="msg sis">' + (sel ? "Sin mensajes con este tripulante." : "") + "</div>";
    if (abajo) c.scrollTop = c.scrollHeight;
  }
  async function enviar(texto) { texto = String(texto || "").trim(); if (!texto || !sel) return; const m = await api("/api/mensajes", { sujeto: sel, de: "tierra", autor, texto }); msgs.push(m); ult = Math.max(ult, m.id); pintarHilo(); $("#m-hilo").scrollTop = 1e9; }
  $("#m-form").addEventListener("submit", e => { e.preventDefault(); const i = $("#m-texto"), t = i.value; i.value = ""; enviar(t).catch(err => { i.value = t; alertar("No se pudo enviar: " + err.message); }); });
  function alertar(t) { $("#m-dir-nota").textContent = t; }

  // ---- ciclo de lectura
  let enCurso = false;
  async function ciclo() {
    if (enCurso) return; enCurso = true;
    try {
      dir = (await api("/api/tripulacion")).tripulacion; enlace = true; if (!sel && dir.length) { sel = dir[0].sujeto; guardar("ah-medico:sel", sel); } if (sel && !dir.some(d => d.sujeto === sel) && dir.length) sel = dir[0].sujeto;
      if (sel && dir.some(d => d.sujeto === sel)) {
        est = await api("/api/tripulacion/estado?sujeto=" + encodeURIComponent(sel));
        const d = await api("/api/mensajes?sujeto=" + encodeURIComponent(sel) + "&desde=" + ult + "&lector=tierra"), nuevos = d.mensajes.filter(m => m.id > ult);
        nuevos.forEach(m => { msgs.push(m); ult = Math.max(ult, m.id); }); if (nuevos.length) pintarHilo();
      }
    } catch (e) { enlace = false; }
    enCurso = false;
    const ch = $("#m-enlace"); ch.className = "chip s-" + (enlace ? "estable" : "urgencia"); $("em", ch).textContent = enlace ? "Conectado" : "Desconectado";
    pintarDir(); const foco = document.activeElement && $("#m-cuerpo").contains(document.activeElement), abierto = $$("#m-cuerpo details[open]").length;
    if (est && !ocupado && !foco && !abierto && ["tablero", "bienestar", "alertas"].includes(tab)) pintar(); else cabecera();
  }
  $("#m-autor").value = autor; $("#m-autor").addEventListener("change", e => { autor = e.target.value.trim() || "Médico de vuelo"; guardar("ah-medico:autor", autor); });
  $$("#m-idioma button").forEach(b => { b.classList.toggle("on", b.dataset.id === idioma); b.addEventListener("click", () => { guardar("ah-medico:idioma", b.dataset.id); location.reload(); }); });
  setInterval(() => { $("#m-reloj").textContent = hora(); }, 1000); setInterval(ciclo, 2000);
  if (location.protocol === "file:") { $("#m-cab").innerHTML = '<div class="med-cab"><h1>Abre esta consola desde el servidor del monitor</h1><p>Por ejemplo: http://127.0.0.1:8777/medico</p></div>'; } else { pintar(); ciclo(); }
})();
</script>
